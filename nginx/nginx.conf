# =============================================================================
# Genba Management System — Nginx Reverse Proxy Configuration
# Handles: API routing, Frontend SSR, Security headers, Rate limiting, TLS
# See: infrastructure.md §5
# MED-06 Fix: Added HTTPS (443) server block with TLS termination.
# HTTP (80) redirects all traffic to HTTPS.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Character set for Japanese content
    charset utf-8;

    # Performance settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 15m;  # Slightly above 10MB file upload limit

    # Hide nginx version for security
    server_tokens off;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # ==========================================================================
    # Rate Limiting Zones (INFRA§3.2)
    # ==========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m  rate=20r/m;

    # ==========================================================================
    # Upstream Services
    # ==========================================================================
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream web_frontend {
        server web:3000;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP Server — Redirect ALL traffic to HTTPS (MED-06 Fix)
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Security: Redirect HTTP → HTTPS permanently
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # HTTPS Server — Main application server (MED-06 Fix)
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- TLS Configuration ---
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS: only TLS 1.2 and 1.3
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # HSTS — force HTTPS for 1 year (only after confirmed TLS is stable)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security Headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options   "nosniff"                   always;
        add_header X-Frame-Options          "DENY"                      always;
        add_header X-XSS-Protection         "1; mode=block"             always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss:;" always;

        # -----------------------------------------------------------------------
        # Auth endpoints — Stricter rate limit (5 req/min)
        # -----------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Cookie security — httpOnly + Secure (enforced because we are on HTTPS)
            proxy_cookie_flags ~ httponly samesite=lax secure;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # -----------------------------------------------------------------------
        # File upload endpoint — Separate rate limit (20 req/min)
        # -----------------------------------------------------------------------
        location /api/v1/storage/ {
            limit_req zone=upload_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Allow larger payloads for file metadata
            client_max_body_size 1m;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # -----------------------------------------------------------------------
        # All other API routes — Standard rate limit (100 req/min)
        # -----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # -----------------------------------------------------------------------
        # Next.js — Hot Module Replacement WebSocket (development only)
        # -----------------------------------------------------------------------
        location /_next/webpack-hmr {
            proxy_pass         http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # -----------------------------------------------------------------------
        # Next.js Static Assets — Cache aggressively
        # -----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass         http://web_frontend;
            proxy_cache_valid  200 365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # -----------------------------------------------------------------------
        # Frontend — All other routes
        # -----------------------------------------------------------------------
        location / {
            proxy_pass         http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # -----------------------------------------------------------------------
        # Error pages
        # -----------------------------------------------------------------------
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"リクエストが多すぎます。しばらくしてから再試行してください","details":[]}}';
        }

        error_page 502 503 504 /503.json;
        location = /503.json {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"サービスが一時的に利用できません","details":[]}}';
        }
    }
}
