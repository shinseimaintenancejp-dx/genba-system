[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "genba-management-backend"
version = "1.0.0"
description = "Genba Management System — FastAPI Backend (Shinsei)"
requires-python = ">=3.11"

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
env = [
    "DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5432/genba_test",
    "REDIS_URL=redis://localhost:6379/1",
    "SECRET_KEY=test-secret-key-not-for-production-must-be-32chars",
    "ENCRYPTION_KEY=test-encryption-key-32-bytes-long!!",
    "STORAGE_ENDPOINT=http://localhost:9000",
    "STORAGE_ACCESS_KEY=test_access",
    "STORAGE_SECRET_KEY=test_secret",
    "STORAGE_BUCKET_NAME=genba-test",
    "STORAGE_REGION=us-east-1",
    "ENVIRONMENT=test",
    "DEBUG=false",
]

# =============================================================================
# Ruff — Linting & Formatting (replaces flake8, black, isort)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.isort]
known-first-party = ["app"]

# =============================================================================
# Mypy — Static Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "alembic/"]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "app/scripts/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
