# =============================================================================
# Genba Management System — Alembic Configuration
# Async engine support for PostgreSQL 16 via asyncpg
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = app/migrations

# Naming convention for auto-generated migration files
# Format: {sprint_number}_{description}.py (see BE§7)
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Truncate long slugs
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# SQLAlchemy database URL — overridden by env.py from Pydantic settings
# Do NOT hardcode actual credentials here
sqlalchemy.url = driver://user:pass@localhost/dbname


# =============================================================================
# Logging configuration
# =============================================================================
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
