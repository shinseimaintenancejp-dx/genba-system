# =============================================================================
# Genba Management System — Docker Compose (Development)
# 5 services: db, redis, api, web, nginx
# Cloud-agnostic: runs on any Linux VPS via Docker Compose
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Primary Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: genba_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: genba_management
      POSTGRES_USER: ${DB_USER:-genba_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      # MED-05 Fix: bind to 127.0.0.1 so PostgreSQL is not accessible from host network interfaces
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genba_user} -d genba_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - genba_network

  # ---------------------------------------------------------------------------
  # Redis 7 — Session Cache & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: genba_redis
    restart: unless-stopped
    # HIGH-05 Fix: requirepass prevents unauthenticated access from other containers
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # MED-05 Fix: bind to 127.0.0.1 so Redis is not accessible from host network interfaces
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genba_network

  # ---------------------------------------------------------------------------
  # FastAPI — Backend API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: genba_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-genba_user}:${DB_PASSWORD}@db:5432/genba_management
      # HIGH-05 Fix: include password in Redis URL
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-genba-management}
      STORAGE_REGION: ${STORAGE_REGION:-apac}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app  # Hot reload in development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - genba_network

  # ---------------------------------------------------------------------------
  # Next.js 15 — Frontend SSR Server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: genba_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: development
    volumes:
      - ./frontend:/app        # Hot reload in development
      - /app/node_modules       # Preserve node_modules from container
      - /app/.next              # Preserve Next.js build cache
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - genba_network

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy & Security Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: genba_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
    networks:
      - genba_network

# =============================================================================
# Volumes — persistent data
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  genba_network:
    driver: bridge
